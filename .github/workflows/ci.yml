name: CI

# Every branch except main, plus PRs. main is covered by the PR that merged into
# it; a deploy workflow (if any) owns pushes to main.
on:
  push:
    branches-ignore: [main]
  pull_request:

# Read-only floor. Grant more per job, only where a step actually writes.
permissions:
  contents: read

jobs:
  verify:
    # Skipped only in backlog-loop itself (named claude-code-repo-template before #68) and
    # its forks, which keep the name: it
    # has no project to verify, and template-self-test.yml tests its scripts. Keyed
    # on the name, not the template flag, so a repo created from it — even one you
    # mark as your own template — always runs its real CI. Rename such a repo if
    # you ever call it backlog-loop.
    if: ${{ !contains(fromJSON('["backlog-loop", "claude-code-repo-template"]'), github.event.repository.name) }}
    runs-on: ubuntu-latest
    steps:
      # Pin every action to a commit SHA: a tag can be moved to other code, a SHA
      # cannot. Dependabot (.github/dependabot.yml) updates the SHA and the
      # version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails on purpose until replaced. A placeholder that passes would give a
      # new repo a green check that tests nothing. Replace this step with the
      # same build / lint / test commands listed under "Verify" in CLAUDE.md,
      # so CI and the backlog loop's definition of done cannot drift apart.
      # Then see docs/CI_HARDENING.md for steps that keep a green check honest.
      - name: Verify (not configured)
        run: |
          echo "::error::CI is not configured. Replace this step with the Verify commands from CLAUDE.md."
          exit 1
