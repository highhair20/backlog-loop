name: Ready to merge

# Labels the backlog loop's PRs that are ready to merge and tells the maintainer,
# by running scripts/ready-to-merge.sh (#88). It never updates a branch: a push made
# with this workflow's token starts no other workflow, so CI would never run on it.
# The loop session updates a PR that is only behind main (Step 1.5).
on:
  # When a PR's checks finish. workflow_run needs each workflow's name (no wildcards):
  # list every workflow whose checks a PR must pass to merge.
  workflow_run:
    workflows: [CI, Template self-test]
    types: [completed]
  # When an issue's labels change: the loop's Step 8 swaps in-progress for in-review
  # once it is done with a PR, which may be after that PR's CI has finished.
  issues:
    types: [labeled, unlabeled]
  # When main moves, so PRs that fell behind lose the label.
  push:
    branches: [main]
  # When a PR's labels change, so changes-requested takes the label off at once
  # (#110), and comes back when it is removed. pull_request_target, never
  # pull_request: it runs main's copy of this file, never the PR's. It never runs the
  # PR's code either (the checkout below is the default branch), which is what makes
  # this trigger safe. Its run still puts a check on the PR's head, as every run here
  # can; the script sets this workflow's own checks aside. A new push is judged when
  # its CI completes (workflow_run).
  pull_request_target:
    types: [labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

# Runs queue rather than cancel: each reads fresh state, and a cancelled one could
# leave a PR labelled but not announced. A newer pending run replaces an older one,
# which is safe for the same reason.
concurrency:
  group: ready-to-merge
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      # The default branch, never the PR's: a PR must not change the script that judges it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          # The script uses GH_TOKEN; no git command needs the token after checkout.
          persist-credentials: false
      - name: Label ready PRs
        run: scripts/ready-to-merge.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
