name: Template self-test

# Tests the template's own scripts. Inert in repos created from the template
# (the job only runs in a repo named claude-code-repo-template, i.e. this one and its
# forks); safe to delete there.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync-guardrails:
    if: github.event.repository.name == 'claude-code-repo-template'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Preinstalled on ubuntu-latest. Warning level and up; style notes are advisory.
      - name: Lint shell scripts
        run: shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh
      - name: Test sync-guardrails.sh
        run: scripts/test-sync-guardrails.sh
      - name: Test check-verify-section.sh
        run: scripts/test-check-verify-section.sh
      - name: Test backlog-loop.sh
        run: scripts/test-backlog-loop.sh
      - name: Test protect-main.sh
        run: scripts/test-protect-main.sh
      - name: Test pr-created-review.sh
        run: scripts/test-pr-created-review.sh
      - name: Test settings.local.json.example
        run: scripts/test-settings-example.sh
      - name: Test label definitions
        run: scripts/test-labels.sh
      - name: Test setup.sh
        run: scripts/test-setup.sh
      - name: Test repo files (pinned actions, issue forms, defaults)
        run: scripts/test-repo-files.sh
      - name: Test vendor-agents.sh and agent drift
        run: scripts/test-vendor-agents.sh
