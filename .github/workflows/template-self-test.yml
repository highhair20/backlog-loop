name: Template self-test

# Tests the template's own scripts. Inert in repos created from the template
# (the job only runs while the repo is marked as a template); safe to delete there.
on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync-guardrails:
    if: github.event.repository.is_template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test sync-guardrails.sh
        run: scripts/test-sync-guardrails.sh
      - name: Test check-verify-section.sh
        run: scripts/test-check-verify-section.sh
      - name: Test backlog-loop.sh
        run: scripts/test-backlog-loop.sh
